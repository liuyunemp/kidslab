<html lang="zh-CN" data-theme="light">

  <meta name="color-scheme" content="light dark" />
  <title>有机分子工坊 · KidsLab</title>
  <link rel="stylesheet" href="style.css?v=1f6ee9b9" />

<script>(function(){try{var s=JSON.parse(sessionStorage.getItem('kidslab.starmap')||'null');if(!s||!s.open)return;var zh=(document.documentElement.lang||'zh').indexOf('zh')===0;var a=document.createElement('a');a.href='../../index.html#starmap';a.className='kidslab-starmap-back';a.title=zh?'\u8fd4\u56de\u661f\u56fe':'Back to Star Map';a.setAttribute('aria-label',a.title);a.textContent='\u2726';a.style.cssText='position:fixed;right:14px;bottom:14px;z-index:2147483000;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;border-radius:50%;color:#7ce7ff;background:rgba(16,18,48,.82);border:1px solid rgba(124,231,255,.45);box-shadow:0 4px 14px rgba(0,0,0,.35);text-decoration:none;backdrop-filter:blur(6px)';function add(){document.body.appendChild(a)}if(document.body)add();else document.addEventListener('DOMContentLoaded',add)}catch(e){}})()</script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <a class="pill back" href="../../index.html">← <span data-t="back">返回平台</span></a>
      <div class="brand">
        <span class="brand__mark" aria-hidden="true">⚛️</span>
        <div>
          <h1 data-t="title">有机分子工坊</h1>
          <p data-t="subtitle">点发光键位拼分子，台上直接读键角、滴试剂</p>
        </div>
      </div>
      <div class="bar__actions">
        <button class="pill icon-pill" id="musicBtn" type="button" aria-pressed="true">♫</button>
        <button class="pill icon-pill" id="soundBtn" type="button" aria-pressed="true">🔊</button>
        <button class="pill icon-pill" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
        <button class="pill lang" id="langBtn" type="button">EN</button>
      </div>
    </header>

    <main class="lab">
      <section class="viewport" aria-label="三维分子球棍拼装台">
        <canvas id="scene" width="1" height="1"></canvas>
        <div class="nogl" id="nogl" hidden>
          <strong data-t="noglTitle">这台设备暂时打不开 3D 拼装台</strong>
          <span data-t="noglText">换一个支持 WebGL 的浏览器就能拼分子了。</span>
        </div>

        <div class="scene-heading">
          <span class="eyebrow" id="labState">空台</span>
          <strong id="readFormula">—</strong>
          <div class="hud-row">
            <span><small data-t="readFree">空着的键</small><b id="readFree">—</b></span>
            <span><small data-t="readAngle">键角读数</small><b id="readAngle">—</b></span>
          </div>
        </div>

        <p class="coach" id="coach" role="status">选一个原子，点发光的键位</p>

        <div class="view-dock" role="group" aria-label="观察视角">
          <button class="view-btn is-active" type="button" data-view="stage" aria-pressed="true">
            <span aria-hidden="true">◇</span><span data-t="viewStage">舞台</span>
          </button>
          <button class="view-btn" type="button" data-view="front" aria-pressed="false">
            <span aria-hidden="true">▭</span><span data-t="viewFront">正视</span>
          </button>
          <button class="view-btn" type="button" data-view="side" aria-pressed="false">
            <span aria-hidden="true">◫</span><span data-t="viewSide">侧视</span>
          </button>
          <button class="view-btn" id="autoOrbitBtn" type="button" aria-pressed="false">
            <span aria-hidden="true">↻</span><span data-t="autoOrbit">自动环绕</span>
          </button>
        </div>

        <div class="tool-dock" role="group" aria-label="原子托盘">
          <button class="atom-chip atom-chip--c is-selected" type="button" data-element="C" aria-pressed="true">
            <span class="atom-dot" aria-hidden="true">C</span><span data-t="atomC">碳</span>
          </button>
          <button class="atom-chip atom-chip--h" type="button" data-element="H" aria-pressed="false">
            <span class="atom-dot" aria-hidden="true">H</span><span data-t="atomH">氢</span>
          </button>
          <button class="atom-chip atom-chip--o" type="button" data-element="O" aria-pressed="false">
            <span class="atom-dot" aria-hidden="true">O</span><span data-t="atomO">氧</span>
          </button>
          <button class="tool-btn" id="measureBtn" type="button" aria-pressed="false">
            <span aria-hidden="true">📐</span><span data-t="measure">量键角</span>
          </button>
          <button class="tool-btn" id="undoBtn" type="button">
            <span aria-hidden="true">↶</span><span data-t="undo">拆掉一个</span>
          </button>
          <button class="tool-btn" id="clearBtn" type="button">
            <span aria-hidden="true">↺</span><span data-t="clear">清空</span>
          </button>
        </div>

        <div class="scene-markers" id="sceneMarkers"></div>
        <div class="focus-toast" id="toast" hidden role="status" aria-live="polite"></div>
      </section>

      <aside class="console" id="console">
        <button class="sheet-handle" id="sheetHandle" type="button" aria-expanded="true">
          <span></span><b data-t="parameters">实验台</b>
        </button>

        <div class="console__body">
          <div class="station-tabs" role="group" aria-label="实验站">
            <button class="station-tab is-active" type="button" data-station="build" aria-pressed="true" data-t="tabBuild">拼装</button>
            <button class="station-tab" type="button" data-station="react" aria-pressed="false" data-t="tabReact">试剂</button>
            <button class="station-tab" type="button" data-station="isomer" aria-pressed="false" data-t="tabIsomer">异构</button>
          </div>

          <section class="station-body" id="stationBuild">
            <p class="current-target" id="currentTarget">甲烷 CH₄</p>
            <div class="target-grid" id="targetGrid" role="list"></div>
            <details class="fold">
              <summary data-t="controlLabel">每次只改一处成键</summary>
              <p data-t="controlBuild">其余原子先不动。规律是台上读出来的，不是卷子上抄的。</p>
            </details>
          </section>

          <section class="station-body" id="stationReact" hidden>
            <p class="target-hint" id="reactSample"></p>
            <div class="reagent-grid" id="reagentGrid" role="group" aria-label="试剂"></div>
            <button class="wide-btn" id="dripBtn" type="button" disabled data-t="drip">滴上去看看</button>
            <p class="feedback" id="reactFeedback" role="status" aria-live="polite"></p>
          </section>

          <section class="station-body" id="stationIsomer" hidden>
            <p data-t="isomerPrompt">只给你分子式。原子数一样，连法不一样，就是不同的物质。</p>
            <p class="formula-chip" id="isomerFormula">C₂H₆O</p>
            <div class="isomer-progress" id="isomerProgress"></div>
            <button class="wide-btn" id="isomerNextBtn" type="button" hidden data-t="isomerNext">换下一张分子式卡 →</button>
            <p class="feedback" id="isomerFeedback" role="status" aria-live="polite"></p>
            <details class="fold">
              <summary data-t="isomerRuleTitle">怎么算同一种？</summary>
              <p data-t="isomerRule">只看谁跟谁相连，摆的角度不算。</p>
            </details>
          </section>

          <section class="log-block">
            <div class="log-head">
              <h2 data-t="logTitle">分子档案</h2>
              <button class="reset-button" id="resetBtn" type="button" data-t="reset">重开实验</button>
            </div>
            <div class="data-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th data-t="colMolecule">分子</th>
                    <th data-t="colFormula">分子式</th>
                    <th data-t="colShape">形状</th>
                    <th data-t="colAngle">键角</th>
                    <th data-t="colGroup">官能团</th>
                  </tr>
                </thead>
                <tbody id="archiveBody"></tbody>
              </table>
            </div>
          </section>

          <section class="matrix-card">
            <div class="matrix-head">
              <span data-t="matrixTitle">反应矩阵</span>
              <small id="matrixCount">0 / 16</small>
            </div>
            <div class="data-table-wrap">
              <table class="matrix-table">
                <thead>
                  <tr id="matrixHead"></tr>
                </thead>
                <tbody id="matrixBody"></tbody>
              </table>
            </div>
            <details class="fold">
              <summary data-t="legendTitle">怎么读这张表</summary>
              <p class="matrix-legend"><span data-t="legendYes">✓ 有变化</span> · <span data-t="legendNo">✗ 没变化</span> · <span data-t="legendUnknown">· 还没试</span></p>
            </details>
          </section>

          <p class="conclusion" id="conclusion" role="status" aria-live="polite"></p>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="main.js?v=185a958c"></script>
</body>
</html>
