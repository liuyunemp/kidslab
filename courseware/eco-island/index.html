</head>
<body>
  <div class="site-bg" aria-hidden="true">
    <i class="sun"></i>
    <i class="cloud cloud--1"></i>
    <i class="cloud cloud--2"></i>
    <i class="sea"></i>
  </div>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title"><span aria-hidden="true">🌿</span> <span data-t="title">生态小岛</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="app">
    <section class="brief card">
      <div class="brief__camp">
        <small data-t="islandLabel">岛</small>
        <strong id="islandNumber">01</strong>
      </div>
      <div class="brief__copy">
        <p class="eyebrow" id="islandKicker">第一岛 · 光秃秃</p>
        <h2 id="islandTitle">这座岛怎么没有草？</h2>
        <p id="status" role="status" aria-live="polite">从台子上把草种到岛上，看看会发生什么。</p>
      </div>
      <div class="health" aria-label="生态环境健康度">
        <span class="health__ring" id="healthRing" data-pct="0">
          <strong id="healthValue">0%</strong>
        </span>
        <div class="health__goals" id="goalList" aria-label="康复目标"></div>
      </div>
    </section>

    <nav class="camp-nav" id="campNav" aria-label="小岛关卡"></nav>

    <section class="workspace">
      <section class="scene card" aria-labelledby="sceneTitle">
        <div class="scene__head">
          <div>
            <p class="section-label" data-t="sceneLabel">小岛</p>
            <h2 id="sceneTitle" data-t="sceneTitle">上帝视角</h2>
          </div>
          <button class="ghost-btn" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">轻提示</span></button>
        </div>

        <div class="stage" id="stage">
          <canvas id="island" aria-label="生态小岛画布"></canvas>
          <div class="legend" id="legend" aria-hidden="true"></div>
          <p class="lesson" id="lessonText" hidden>植物先长出来，动物才有东西吃。</p>
        </div>

        <div class="meters" aria-label="种群仪表">
          <div class="meter" data-species="grass">
            <span class="meter__dot dot--grass">🌱</span>
            <strong id="mGrass">0</strong>
            <small data-t="grass">草</small>
          </div>
          <div class="meter" data-species="rabbit">
            <span class="meter__dot">🐇</span>
            <strong id="mRabbit">0</strong>
            <small data-t="rabbit">兔</small>
          </div>
          <div class="meter" data-species="fox">
            <span class="meter__dot">🦊</span>
            <strong id="mFox">0</strong>
            <small data-t="fox">狐</small>
          </div>
          <div class="meter" data-species="carcasses">
            <span class="meter__dot">🦴</span>
            <strong id="mCarcass">0</strong>
            <small data-t="carcass">尸体</small>
          </div>
        </div>
      </section>

      <aside class="tools card">
        <div class="tools__head">
          <div>
            <p class="section-label" data-t="toolsLabel">投放台</p>
            <h2 id="toolsTitle" data-t="toolsTitle">放谁上岛</h2>
          </div>
          <button class="ghost-btn" id="restartBtn" type="button" data-t="restart">重新放</button>
        </div>
        <div class="species-grid" id="speciesGrid" aria-label="可投放的物种"></div>
        <p class="nutrient-line">
          <span class="nutrient-bar" id="nutrientBar" aria-hidden="true"></span>
          <span id="nutrientLabel" data-t="nutrient">土壤养分</span>
        </p>
      </aside>
    </section>
  </main>

  <div class="modal" id="completeModal" hidden>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="modal__burst" aria-hidden="true">🌿🐇🦊🍄</div>
      <p class="modal__kicker" data-t="finalKicker">全岛复苏完成</p>
      <h2 id="completeTitle" data-t="finalTitle">小岛绿了，动物回来了！</h2>
      <p data-t="finalText">生产者、消费者、分解者各司其职，食物链一环不缺，整座岛才站得稳。</p>
      <button class="action" id="nextBtn" type="button" data-t="nextIsland">下一座岛</button>
    </section>
  </div>

  <script type="module" src="main.js?v=42ac1699"></script>
</body>
</html>
