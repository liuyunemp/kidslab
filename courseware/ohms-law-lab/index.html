<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="拧电压和电阻，看着电流光点穿过电阻，自己发现欧姆定律。">
  <meta name="color-scheme" content="light dark">
  <title>⚡ 欧姆定律实验室 · KidsLab</title>
  <link rel="stylesheet" href="style.css?v=ad8fccd8">
  <script>
    (() => {
      try {
        const theme = localStorage.getItem('kidslab.theme')
          || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const lang = localStorage.getItem('kidslab.lang')
          || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en');
        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
      } catch { /* private mode */ }
    })();
  </script>
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>

</head>
<body>
  <canvas id="circuitScene" aria-label="3D 电路实验桌"></canvas>
  <p class="nogl" id="nogl" hidden data-t="fallback">这台设备暂时不能显示 3D 实验桌，仍可以用右侧旋钮看电压和电流。</p>
  <main id="app" hidden data-status="live"></main>
  <span id="sceneStatus" hidden></span>

  <header class="bar">
    <a class="pill" id="backBtn" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title">⚡ <span data-t="title">欧姆定律实验室</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="musicBtn" type="button" aria-pressed="true">♫</button>
      <button class="pill pill--icon" id="soundBtn" type="button" aria-pressed="true">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <section class="hud" aria-label="live instruments">
    <div class="hud__chip"><span class="hud__label" data-t="measuredU">电压 · 推力</span><b id="voltReadout">1.5 V</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="measuredI">电流 · 流量</span><b id="ampReadout">0.15 A</b></div>
    <div class="hud__chip"><span class="hud__label" data-t="selectedR">电阻 · 拥挤</span><b id="resistorReadout">10 Ω</b></div>
  </section>

  <p class="coach" id="missionTitle" data-t="observeTitle">拧电压和电阻，看光点跑多快</p>

  <div class="view-dock" role="group" aria-label="观察视角">
    <button class="view-btn" id="zoomInBtn" type="button" data-t="zoomIn">放大</button>
    <button class="view-btn" id="zoomOutBtn" type="button" data-t="zoomOut">缩小</button>
    <button class="view-btn" id="perspectiveBtn" type="button" data-t="perspective">立体</button>
    <button class="view-btn" id="topViewBtn" type="button" data-t="topView">俯视</button>
  </div>

  <aside class="panel" id="panel">
    <div class="panel__quick">
      <button class="btn btn--big" id="recordBtn" type="button" data-t="record">记下这一组读数</button>
      <button class="btn btn--ghost" id="resetBtn" type="button" data-t="reset">清空记录</button>
    </div>
    <button class="panel__handle" id="panelHandle" type="button" aria-expanded="true">
      <span data-t="panelTitle">观测台</span><i id="panelArrow">▾</i>
    </button>
    <div class="panel__body information-column" id="panelBody">
      <section class="panel__group">
        <p class="panel__label"><span data-t="voltageLabel">电源电压 U</span><b id="voltageValue" class="panel__val">1.5 V</b></p>
        <input id="voltageSelect" type="range" min="0" max="6" step="0.1" value="1.5">
        <p class="panel__label"><span data-t="resistanceLabel">电阻 R</span><b id="resistanceValue" class="panel__val">10 Ω</b></p>
        <input id="resistanceSelect" type="range" min="5" max="50" step="1" value="10">
      </section>
      <section class="panel__group ranges">
        <label class="field"><span data-t="ammeterRange">电流表量程</span>
          <select id="ammeterRange">
            <option value="0.3">0–0.30 A</option>
            <option value="3" selected>0–3.00 A</option>
          </select>
        </label>
        <label class="field"><span data-t="voltmeterRange">电压表量程</span>
          <select id="voltmeterRange">
            <option value="3">0–3.0 V</option>
            <option value="15" selected>0–15.0 V</option>
          </select>
        </label>
      </section>
      <p class="meter-line"><span id="supplySetting"></span><span id="theoryCurrent"></span></p>
      <p id="calculation" class="readout"></p>
      <p id="instrumentNote" class="panel__hint"></p>

      <section class="panel__group">
        <p class="panel__label"><span data-t="notebookTitle">U-I 观测图</span><b id="trialCount" class="panel__val">0</b></p>
        <svg id="graph" viewBox="0 0 320 190" role="img" aria-label="电压电流关系图">
          <line x1="38" y1="156" x2="302" y2="156" class="axis"></line>
          <line x1="38" y1="156" x2="38" y2="18" class="axis"></line>
          <g id="graphLines"></g>
        </svg>
        <div class="table-wrap">
          <table class="log-table">
            <thead><tr><th data-t="trial">次数</th><th>U (V)</th><th>I (A)</th><th>R (Ω)</th></tr></thead>
            <tbody id="trialRows"></tbody>
          </table>
        </div>
      </section>
      <p id="feedback" class="panel__hint"></p>
    </div>
  </aside>

  <p class="foot-tip" data-t="sceneHelp">拖空白转视角 · 滚轮缩放 · 光点从正极走向负极</p>
  <script type="module" src="main.js?v=8d99122f"></script>
</body>
</html>
