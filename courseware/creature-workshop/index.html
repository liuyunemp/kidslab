</head>
<body>
  <div class="sand-bg" aria-hidden="true">
    <i class="blob blob--sun"></i>
    <i class="blob blob--leaf"></i>
    <i class="blob blob--dune"></i>
  </div>

  <header class="bar">
    <a class="pill" href="../../index.html">← <span data-t="back">返回平台</span></a>
    <h1 class="bar__title"><span aria-hidden="true">🦎</span> <span data-t="title">造兽工坊</span></h1>
    <div class="bar__actions">
      <button class="pill pill--icon" id="soundBtn" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
      <button class="pill pill--icon" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="pill" id="langBtn" type="button">EN</button>
    </div>
  </header>

  <main class="app">
    <section class="brief card">
      <div class="brief__camp">
        <small data-t="campLabel">委托</small>
        <strong id="campNumber">01</strong>
      </div>
      <div class="brief__copy">
        <p class="eyebrow" id="campKicker">第一站 · 沙漠</p>
        <h2 id="campTitle">拼一只能在热沙子上活两天的动物</h2>
        <p id="status" role="status" aria-live="polite">先给它选耳朵、皮毛、脚和一件装备。</p>
      </div>
      <div class="meters" aria-label="生存仪">
        <div class="meter">
          <span data-t="hourLabel">小时</span>
          <strong id="hourValue">0</strong>
        </div>
        <div class="lamp" id="liveLamp" data-state="idle">
          <span class="lamp__dot" aria-hidden="true"></span>
          <strong id="liveText">待放生</strong>
        </div>
      </div>
    </section>

    <nav class="camp-nav" id="campNav" aria-label="栖息地"></nav>

    <section class="workspace">
      <section class="scene card" aria-labelledby="sceneTitle">
        <div class="scene__head">
          <div>
            <p class="section-label" data-t="yardLabel">放生场</p>
            <h2 id="sceneTitle" data-t="yardTitle">看看它怎么过活</h2>
          </div>
          <button class="ghost-btn" id="hintBtn" type="button"><span aria-hidden="true">💡</span> <span data-t="hint">轻提示</span></button>
        </div>

        <div class="stage" id="stage" data-habitat="desert" data-run="idle">
          <div class="sky" aria-hidden="true">
            <span class="sun"></span>
            <span class="moon"></span>
            <span class="cloud c1"></span>
            <span class="cloud c2"></span>
            <span class="flake f1"></span>
            <span class="flake f2"></span>
            <span class="flake f3"></span>
          </div>
          <div class="ground" aria-hidden="true">
            <span class="prop prop-a"></span>
            <span class="prop prop-b"></span>
            <span class="prop prop-c"></span>
          </div>
          <div class="beast" id="beast" data-ears="" data-coat="" data-feet="" data-extra="">
            <span class="beast__ear beast__ear--l"></span>
            <span class="beast__ear beast__ear--r"></span>
            <span class="beast__head">
              <span class="beast__eye"></span>
              <span class="beast__eye"></span>
              <span class="beast__nose"></span>
              <span class="beast__tongue"></span>
            </span>
            <span class="beast__hump"></span>
            <span class="beast__body"></span>
            <span class="beast__leg beast__leg--l"></span>
            <span class="beast__leg beast__leg--r"></span>
            <span class="beast__foot beast__foot--l"></span>
            <span class="beast__foot beast__foot--r"></span>
            <span class="beast__tail"></span>
          </div>
          <div class="fame" id="fameCard" hidden>
            <p class="fame__kicker" id="fameKicker">生存名人堂</p>
            <strong id="fameTitle">耳廓狐</strong>
            <span id="fameText">原来大耳朵是沙漠里的空调。</span>
          </div>
        </div>
        <p class="lesson" id="lessonText" hidden>没有最好的身体，只有最合适的身体。</p>
      </section>

      <aside class="tools card">
        <div class="tools__head">
          <div>
            <p class="section-label" data-t="partsLabel">零件库</p>
            <h2 id="toolsTitle" data-t="partsTitle">给它换装</h2>
          </div>
          <button class="ghost-btn" id="restartBtn" type="button" data-t="restart">重新开坊</button>
        </div>
        <div class="slot-nav" id="slotNav"></div>
        <div class="part-grid" id="partGrid"></div>
        <button class="action" id="releaseBtn" type="button" data-t="release">放生 48 小时</button>
      </aside>
    </section>
  </main>

  <div class="modal" id="completeModal" hidden>
    <section class="modal__card" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
      <div class="modal__burst" aria-hidden="true">🦎❄️🏝️</div>
      <p class="modal__kicker" data-t="finalKicker">三站放生完成</p>
      <h2 id="completeTitle" data-t="finalTitle">没有最好的身体，只有最合适的身体！</h2>
      <p data-t="finalText">大耳朵在沙漠是空调，到了暴风雪里就成了漏风窗。同一零件，换个地方命运就反转。</p>
      <button class="action" id="playAgainBtn" type="button" data-t="playAgain">再造一窝</button>
    </section>
  </div>

  <script type="module" src="main.js?v=39ddc52f"></script>
</body>
</html>
