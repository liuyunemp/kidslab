<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e47794">
  <title>拼音轨道 · KidsLab</title>
  <link rel="stylesheet" href="./style.css">
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('kidslab.theme')||'light'}catch{}</script>
</head>
<body>
  <header class="topbar">
    <a class="back" id="back" href="../../index.html">← 返回</a>
    <h1 id="title">🚃 拼音轨道</h1>
    <div class="top-actions">
      <button class="icon-button" id="musicBtn" type="button" aria-label="关闭音乐" aria-pressed="true">♫</button>
      <button class="icon-button" id="effectsBtn" type="button" aria-label="关闭音效" aria-pressed="true">🔔</button>
      <button class="icon-button" id="themeBtn" type="button" aria-label="切换主题">🌙</button>
      <button class="icon-button" id="languageBtn" type="button" aria-label="切换语言">EN</button>
    </div>
  </header>
  <main class="game">
    <p class="intro" id="intro">把声母、韵母和声调车厢接起来，拼出图画里的字音。</p>
    <div class="progress-row"><span class="count" id="count">1/8</span><div class="track" id="track" aria-hidden="true"></div><span class="stars" id="stars">⭐ 0</span></div>
    <section class="stage" id="stage" aria-live="polite"></section>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
