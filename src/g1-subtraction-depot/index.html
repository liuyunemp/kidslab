<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4eee2"><title>一年级探索工坊 · KidsLab</title>
  <link rel="stylesheet" href="./style.css">
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <canvas id="scene" aria-label="3D 探索舞台"></canvas>
  <header class="topbar">
    <a id="back" href="../../index.html" class="icon" aria-label="返回平台">←</a>
    <h1 id="title"></h1>
    <button id="muteBtn" class="icon" type="button">🔊</button>
    <button id="settingsBtn" class="icon" type="button" aria-expanded="false">♫</button>
    <button id="themeBtn" class="icon" type="button">🌙</button>
    <button id="langBtn" class="icon" type="button">EN</button>
  </header>
  <div id="soundMenu" class="sound-menu" hidden>
    <button id="musicBtn" type="button"></button>
    <button id="soundBtn" type="button"></button>
    <button id="speechBtn" type="button"></button>
  </div>
  <section class="status-strip"><span id="unitBadge"></span><strong id="progress" aria-live="polite">0/8</strong></section>
  <button id="coach" class="coach" type="button"></button>
  <section id="stageReadout" class="stage-readout" aria-live="polite"></section>
  <p id="feedback" class="feedback" role="status" hidden></p>
  <aside id="panel" class="panel">
    <button id="panelHandle" type="button" aria-controls="panelBody" aria-expanded="true"><span data-t="tools"></span><span id="panelArrow">▾</span></button>
    <div id="panelBody">
      <div class="route"><label class="sr-only" for="activitySelect" data-t="choose"></label><select id="activitySelect"></select><button id="freeBtn" type="button" data-t="free" aria-pressed="false"></button></div>
      <div id="controls"></div>
      <div class="utility"><button id="undoBtn" type="button" data-t="undo"></button><button id="resetBtn" type="button" data-t="reset"></button><button id="lessonBtn" type="button" data-t="discover" aria-expanded="false"></button></div>
      <section id="lesson" hidden><p id="lessonText"></p><p id="bookSource"></p><a id="bookLink" target="_blank" rel="noopener" data-t="source"></a></section>
    </div>
  </aside>
  <section id="nogl" class="nogl" hidden><h2 data-t="no3d"></h2><p data-t="no3dHint"></p><a href="../../index.html" data-t="back"></a></section>
  <script type="module" src="./main.js"></script>
</body>
</html>
