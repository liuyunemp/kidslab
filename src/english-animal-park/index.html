<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🐘 动物欢乐园 · KidsLab</title>
  <link rel="stylesheet" href="style.css">
  <script src="../../scripts/sdk/core.js" data-kidslab-sdk></script>
  <script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <header class="bar">
    <a class="pill" href="../../" data-t-aria-label="back" aria-label="返回平台">←</a>
    <h1 id="title">🐘 动物欢乐园</h1>
    <button class="pill" id="soundBtn" type="button" aria-label="关闭全部声音">🔊</button>
    <button class="pill" id="themeBtn" type="button" aria-label="切换主题">☀</button>
    <button class="pill" id="langBtn" type="button" aria-label="切换语言">EN</button>
  </header>
  <section class="journey" id="journey" aria-label="学习进度">
    <div class="journey__top"><strong id="roundLabel"></strong><span id="coverage"></span></div>
    <ol id="levelSteps"></ol>
  </section>
  <main class="panel" id="panel">
    <div class="score"><span id="hearts"></span><span id="progressVal"></span><b id="timer"></b></div>
    <div class="time-track" aria-hidden="true"><i id="timeFill"></i></div>
    <section id="playArea">
      <p class="coach" id="coach" aria-live="polite"></p>
      <div id="prompt"></div>
      <div class="choices" id="choices"></div>
      <p id="notice" role="status" hidden></p>
      <div class="controls" id="controls"></div>
    </section>
    <button id="panelHandle" class="settings-handle" type="button" aria-expanded="false"><span data-t="tools">设置与帮助</span><span aria-hidden="true">⚙</span></button>
    <section id="panelBody" class="settings" hidden>
      <button id="musicBtn" type="button" class="setting"></button>
      <button id="effectsBtn" type="button" class="setting"></button>
      <button id="speechBtn" type="button" class="setting"></button>
      <button id="hintBtn" type="button" class="setting" data-t="hint">听听怎么玩</button>
      <p data-t="help">每题 20 秒，每关 3 颗心。选错可以重试，错词会再出现。</p>
    </section>
  </main>
  <div class="pause-cover" id="pauseCover" hidden><div><p id="pauseText"></p><button id="resumeBtn" type="button" class="primary" data-t="resume">继续挑战</button></div></div>
  <p id="nogl" class="nogl" hidden data-t="nogl">暂时打不开 3D 舞台，请启用浏览器图形加速后重试。</p>
  <script type="module" src="main.js"></script>
</body>
</html>
